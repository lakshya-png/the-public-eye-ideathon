<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PublicEye - Public Feed</title>
    <link rel="stylesheet" href="style.css">
</head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="index.html">
            <img src="Images/logo.png" height="40">
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="track.html">Track Complaint</a>
            <button class="admin-btn" onclick="openAdminPopup()">
                <i class="fa fa-user"></i> Admin
            </button>
        </nav>
    </header>

    <!-- HEADER SECTION -->
    <section>
        <h1 class="header1">Public Complaints Feed</h1>

        <p class="p1">
            Explore civic issues reported by people in your area. Stay informed and aware.
        </p>
    </section>

    <!-- FEED SECTION -->
    <section class="issues">

        <h2>Recent Complaints</h2>

        <!-- Dynamic content will come here -->
        <div id="feedContainer" class="issue-grid">

        </div>

    </section>

    <!-- ADMIN LOGIN POPUP -->
    <div id="adminPopup" class="popup">
        <div class="popup-box">

            <span class="close-btn" onclick="closePopup('adminPopup')">&times;</span>

            <h3>Admin Login</h3>

            <input type="text" id="adminUser" placeholder="Username">
            <input type="password" id="adminPass" placeholder="Password">

            <button onclick="loginAdmin()">Login</button>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- LOAD FEED -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadFeed();
        });
    </script>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 PublicEye</p>

        <div class="footer-links">
            <a href="#">Contact</a>
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
        </div>
    </footer>

</body>

</html>
